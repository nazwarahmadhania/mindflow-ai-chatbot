        // Navigation Controller
        function navigateTo(page, param = null) {
            const container = document.getElementById('app-container');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Reset Nav Bar Styling
            ['home', 'cities', 'culture', 'culinary', 'calendar', 'about'].forEach(id => {
                const el = document.getElementById(`nav-${id}`);
                if (el) {
                    if (id === page) {
                        el.className = "text-ranah-gold hover:text-amber-300 transition border-b-2 border-ranah-gold pb-1";
                    } else {
                        el.className = "hover:text-ranah-gold transition text-slate-200 pb-1";
                    }
                }
            });

            if (page === 'home') {
                container.innerHTML = renderHomePage();
            } else if (page === 'cities') {
                container.innerHTML = renderCitiesPage();
            } else if (page === 'culture') {
                container.innerHTML = renderCulturePage();
            } else if (page === 'culinary') {
                container.innerHTML = renderCulinaryPage();
            } else if (page === 'calendar') {
                container.innerHTML = renderCalendarPage();
            } else if (page === 'quiz') {
                container.innerHTML = renderQuizPage();
                initQuiz();
            } else if (page === 'about') {
                container.innerHTML = renderAboutPage();
            } else if (page === 'city' && param) {
                const city = citiesData.find(c => c.id === param);
                if (city) {
                    container.innerHTML = renderCityDetailPage(city);
                }
            }

            lucide.createIcons();
            updateFavBadge();
            document.getElementById('header-score').textContent = `${userScore} XP`;
        }

        // Toggles & Modal Helpers
        function toggleFavoritesModal() {

        function toggleFavorite(cityId) {
            if (favorites.includes(cityId)) {
                favorites = favorites.filter(id => id !== cityId);
                showToast("Kota dihapus dari favorit.");
            } else {
                favorites.push(cityId);
                showToast("Kota ditambahkan ke favorit!");
            }
            localStorage.setItem('rk_favorites', JSON.stringify(favorites));
            updateFavBadge();
        }

        function updateFavBadge() {
            const badge = document.getElementById('fav-count');
            if (favorites.length > 0) {
                badge.textContent = favorites.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function renderFavoritesList() {
            const list = document.getElementById('fav-list');
            if (favorites.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Belum ada kota favorit yang disimpan.</p>`;
                return;
            }

            let html = '';
            favorites.forEach(id => {
                const city = citiesData.find(c => c.id === id);
                if (city) {
                    html += `
                        <div class="flex items-center justify-between p-3 rounded-2xl bg-ranah-cream border border-slate-200">
                            <div class="flex items-center gap-3">
                                <img src="${city.banner}" class="w-12 h-12 rounded-xl object-cover" />

                                <button onclick="toggleFavorite('${city.id}'); renderFavoritesList()" class="p-1 text-red-500 hover:bg-red-50 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>

                        </div>
                    `;
                }
            });
            list.innerHTML = html;
            lucide.createIcons();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
                showToast(`Pengucapan: "${text}"`);
            } else {
                showToast("Fitur audio tidak didukung di browser ini.");
            }
        }

                            <p class="text-xs text-slate-600 leading-relaxed">Songket Pandai Sikek & Silungkang bernilai tinggi dengan benang emas dan sulaman halus.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 4. CULINARY PAGE
        function renderCulinaryPage() {
            return `
                <div class="max-w-7xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8 py-8 sm:py-12 space-y-6 sm:space-y-8">
                    <div>
                        <span class="text-xs font-bold text-ranah-gold uppercase tracking-wider">Cita Rasa Rempah</span>
                        <h1 class="text-2xl sm:text-3xl font-serif font-bold text-slate-900 mt-1">Kuliner Khas Minangkabau</h1>
                        <p class="text-xs text-ranah-textMuted mt-1">Kenikmatan hidangan berbumbu rempah pekat autentik pilihan dunia.</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                        ${citiesData.flatMap(c => c.culinary).map(item => `
                            <div class="bg-white rounded-3xl p-4 sm:p-6 border border-slate-200/80 shadow-sm space-y-3 sm:space-y-4 flex flex-col justify-between">
                                <div class="space-y-2 sm:space-y-3">

                                    <div class="flex justify-between items-start">

                                        <span class="text-[9px] sm:text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full">${item.spiciness}</span>
                                    </div>
                                    <p class="text-xs text-slate-600 leading-relaxed">${item.desc}</p>
                                    <div class="text-[10px] sm:text-[11px] text-slate-500 space-y-0.5">
                                        <p><strong>Bahan Utama:</strong> ${item.ingredients}</p>
                                        <p><strong>Spot Rekomendasi:</strong> ${item.spot}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // 5. CALENDAR PAGE
        function renderCalendarPage() {
            return `
                <div class="max-w-6xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8 py-8 sm:py-12 space-y-6 sm:space-y-8">
                    <div>
                        <span class="text-xs font-bold text-ranah-gold uppercase tracking-wider">Agenda Kebudayaan</span>
                        <h1 class="text-2xl sm:text-3xl font-serif font-bold text-slate-900 mt-1">Kalender Festival & Event Budaya</h1>
                        <p class="text-xs text-ranah-textMuted mt-1">Jadwal lengkap perayaan adat, festival seni, dan pesta rakyat di Ranah Minang.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                        ${festivalEvents.map(ev => `
                            <div class="bg-white rounded-3xl p-4 sm:p-6 border border-slate-200/80 shadow-sm flex gap-3 sm:gap-5 items-start">
                                <img src="${ev.img}" class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl object-cover shrink-0" />
                                <div class="space-y-1 sm:space-y-2">
                                    <span class="text-[9px] sm:text-[10px] bg-ranah-gold/20 text-ranah-dark px-2 sm:px-2.5 py-0.5 rounded-full font-bold">📍 ${ev.city}</span>
                                    <h3 class="text-base sm:text-lg font-serif font-bold text-slate-900">${ev.name}</h3>
                                    <p class="text-xs text-slate-600 leading-relaxed line-clamp-2">${ev.desc}</p>
                                    <p class="text-[10px] sm:text-[11px] text-amber-700 font-semibold flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${ev.date}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // 6. CITY DETAIL PAGE
        function renderCityDetailPage(city) {
            return `
                <div class="relative h-56 sm:h-80 md:h-96 w-full overflow-hidden">
                    <img src="${city.banner}" class="w-full h-full object-cover" />
                    <div class="absolute inset-0 bg-gradient-to-t from-ranah-darker via-ranah-dark/60 to-transparent"></div>
                    <div class="absolute bottom-4 sm:bottom-8 left-0 right-0 max-w-7xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8 text-white space-y-2">
                        <div class="flex items-center gap-2 sm:gap-3">
                            <span class="px-2.5 sm:px-3 py-0.5 sm:py-1 bg-ranah-gold text-ranah-dark font-extrabold text-xs sm:text-sm rounded-full uppercase">${city.nickname}</span>
                            <button onclick="toggleFavorite('${city.id}')" class="p-1.5 sm:p-2 rounded-full bg-white/20 hover:bg-white/40 backdrop-blur-md text-white transition">
                                <i data-lucide="heart" class="w-3.5 h-3.5 sm:w-4 sm:h-4 ${favorites.includes(city.id) ? 'text-red-500 fill-red-500' : ''}"></i>
                            </button>
                        </div>
                        <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-serif font-extrabold tracking-tight">${city.name}</h1>
                        <p class="text-slate-300 text-xs sm:text-sm md:text-base max-w-2xl">${city.tagline}</p>
                    </div>
                </div>

                <div class="max-w-7xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8 py-8 sm:py-12 space-y-8 sm:space-y-12">
                    
                    <!-- Sejarah -->
                    <section class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-sm space-y-4 sm:space-y-6">
                        <h2 class="text-xl sm:text-2xl font-serif font-bold text-slate-900 border-b border-slate-100 pb-2 sm:pb-3">Sejarah Kota ${city.name}</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6 text-xs sm:text-sm text-slate-600 leading-relaxed">
                            <div>
                                <h3 class="font-bold text-slate-800 text-sm mb-1">📍 Asal-usul Nama</h3>
                                <p>${city.history.origin}</p>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-800 text-sm mb-1">📜 Perkembangan</h3>
                                <p>${city.history.development}</p>
                            </div>
                            <div class="bg-amber-50 p-3 sm:p-4 rounded-2xl border border-amber-200">
                                <h3 class="font-bold text-amber-900 text-sm mb-1.5">👥 Tokoh Bersejarah</h3>
                                <ul class="space-y-0.5 text-[10px] sm:text-[11px]">
                                    ${city.history.figures.map(f => `<li>• ${f}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </section>

                    <!-- Landmark -->
                    <section class="space-y-4 sm:space-y-6">
                        <h2 class="text-xl sm:text-2xl font-serif font-bold text-slate-900">🏛️ Landmark Bersejarah</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                            ${city.landmarks.map(lm => `
                                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-200/80 flex flex-col sm:flex-row">
                                    <img src="${lm.img}" class="w-full sm:w-2/5 h-40 sm:h-48 object-cover" />
                                    <div class="p-4 sm:p-6 space-y-1.5 sm:space-y-2 flex flex-col justify-between">
                                        <div>
                                            <span class="text-[9px] sm:text-[10px] font-bold text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-full">${lm.location}</span>
                                            <h3 class="font-serif font-bold text-base sm:text-lg text-slate-900 mt-1">${lm.name}</h3>
                                            <p class="text-xs text-slate-600">${lm.desc}</p>
                                        </div>
                                        <p class="text-[10px] sm:text-[11px] bg-amber-50 text-amber-900 p-2 rounded-xl"><strong>Fakta:</strong> ${lm.fact}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>

                    <!-- Kamus Audio -->
                    <section class="bg-ranah-dark text-white rounded-3xl p-6 sm:p-8 border border-ranah-green shadow-xl space-y-4 sm:space-y-6">
                        <h2 class="text-xl sm:text-2xl font-serif font-bold">🗣️ Mini Kamus Bahasa Minang (${city.name})</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
                            ${city.dictionary.map(d => `
                                <div class="bg-ranah-green/60 p-3 sm:p-4 rounded-2xl border border-ranah-lightgreen flex items-center justify-between">
                                    <div>
                                        <p class="text-[9px] sm:text-[10px] text-slate-300">Indonesia: ${d.indo}</p>
                                        <p class="text-sm sm:text-base font-bold text-ranah-gold">${d.minang}</p>
                                    </div>
                                    <button onclick="playAudio('${d.audioText}')" class="p-1.5 sm:p-2 bg-ranah-gold text-ranah-dark rounded-xl hover:bg-amber-400 transition" title="Dengarkan Suara">
                                        <i data-lucide="volume-2" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </section>

                </div>
            `;
        }

        // 7. QUIZ PAGE
        function renderQuizPage() {
            return `
                <div class="max-w-3xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8 py-8 sm:py-12 space-y-6 sm:space-y-8">
                    <div class="text-center space-y-2">
                        <span class="text-xs font-bold text-ranah-gold uppercase tracking-wider">Gamifikasi Budaya</span>
                        <h1 class="text-2xl sm:text-3xl font-serif font-bold text-slate-900">🎮 Quiz Pengetahuan Minangkabau</h1>
                        <p class="text-xs text-ranah-textMuted">Kumpulkan poin XP untuk meningkatkan level penjelajah budaya Anda!</p>
                    </div>

                    <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-200/80 space-y-4 sm:space-y-6">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-3 sm:pb-4">
                            <span class="text-xs sm:text-sm font-bold text-ranah-gold">Poin XP Anda: ${userScore} XP</span>
                            <span class="text-xs text-slate-400" id="quiz-progress">Soal 1 dari ${quizQuestions.length}</span>
                        </div>

                        <div id="quiz-body" class="space-y-4 sm:space-y-6">
                            <!-- Dynamic Question -->
                        </div>
                    </div>
                </div>
            `;
        }

        let currentQuizIndex = 0;
        function initQuiz() {
            currentQuizIndex = 0;
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const q = quizQuestions[currentQuizIndex];
            const body = document.getElementById('quiz-body');
            const progress = document.getElementById('quiz-progress');

            if (!q) {
                body.innerHTML = `
                    <div class="text-center py-6 sm:py-8 space-y-3 sm:space-y-4">
                        <div class="text-3xl sm:text-4xl">🎉</div>
                        <h3 class="text-xl sm:text-2xl font-serif font-bold text-slate-900">Selamat, Kuis Selesai!</h3>
                        <p class="text-xs sm:text-sm text-slate-600">Total poin XP Anda saat ini adalah <strong>${userScore} XP</strong>.</p>
                        <button onclick="navigateTo('home')" class="px-5 sm:px-6 py-2.5 sm:py-3 bg-ranah-gold text-ranah-dark font-extrabold text-xs sm:text-sm rounded-xl hover:bg-ranah-goldHover transition">Kembali ke Beranda</button>
                    </div>
                `;
                return;
            }

            if (progress) progress.textContent = `Soal ${currentQuizIndex + 1} dari ${quizQuestions.length}`;
            body.innerHTML = `
                <h3 class="text-base sm:text-lg font-bold text-slate-800">${q.question}</h3>
                <div class="space-y-2 sm:space-y-3">
                    ${q.options.map((opt, idx) => `
                        <button onclick="checkQuizAnswer(${idx})" class="w-full text-left p-3 sm:p-4 rounded-2xl border border-slate-200 hover:border-ranah-gold hover:bg-amber-50 font-medium text-xs sm:text-sm text-slate-700 transition flex justify-between items-center">
                            <span>${opt}</span>
                            <i data-lucide="circle" class="w-4 h-4 text-slate-300"></i>
                        </button>
                    `).join('')}
                </div>
            `;
            lucide.createIcons();
        }

        function checkQuizAnswer(selectedIdx) {
            const q = quizQuestions[currentQuizIndex];
            if (selectedIdx === q.answer) {
                userScore += 25;
                localStorage.setItem('rk_score', userScore.toString());
                showToast("Jawaban Benar! +25 XP 🎉");
            } else {
                showToast("Jawaban belum tepat. Coba soal berikutnya!");
            }
            currentQuizIndex++;
            renderQuizQuestion();
        }

        // 8. ABOUT PAGE
        function renderAboutPage() {
            return `
                <div class="max-w-4xl mx-auto px-3 sm:px-4 md:px-6 lg:px-8 py-8 sm:py-12 space-y-6 sm:space-y-8">
                    <div class="text-center space-y-2 sm:space-y-3">
                        <span class="text-xs font-bold text-ranah-gold uppercase tracking-wider">Tentang Portal</span>
                        <h1 class="text-2xl sm:text-3xl font-serif font-bold text-slate-900">RanahKita - Sumatra Barat</h1>
                        <p class="text-xs text-ranah-textMuted max-w-xl mx-auto">Portal ensiklopedia digital dan panduan pariwisata interaktif kebudayaan Minangkabau.</p>
                    </div>

                    <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-sm space-y-4 sm:space-y-6 text-xs sm:text-sm text-slate-600 leading-relaxed">
                        <p>
                            RanahKita didedikasikan untuk melestarikan, mendokumentasikan, dan memperkenalkan kekayaan sejarah, seni, kuliner, serta pesona alam Sumatra Barat kepada generasi muda dan wisatawan mancanegara.
                        </p>
                        <blockquote class="italic border-l-4 border-ranah-gold pl-3 sm:pl-4 py-2 font-serif text-sm sm:text-base text-slate-800 bg-amber-50/50 rounded-r-xl">
                            "Adat Basandi Syarak, Syarak Basandi Kitabullah."
                        </blockquote>
                    </div>
                </div>
            `;
        }

        // Search Controller
        function handleSearch(query) {
            const resultsBox = document.getElementById('search-results');
            if (!query.trim()) {
                resultsBox.classList.add('hidden');
                return;
            }

            const q = query.toLowerCase();
            const matches = citiesData.filter(c => 
                c.name.toLowerCase().includes(q) || 
                c.nickname.toLowerCase().includes(q) ||
                c.culinary.some(cul => cul.name.toLowerCase().includes(q))
            );

            if (matches.length === 0) {
                resultsBox.innerHTML = `<p class="p-4 text-xs text-slate-400 text-center">Tidak ada hasil yang ditemukan.</p>`;
            } else {
                resultsBox.innerHTML = matches.map(c => `
                    <div onclick="openCity('${c.id}'); document.getElementById('search-results').classList.add('hidden')" class="p-3 hover:bg-amber-50 cursor-pointer flex items-center justify-between border-b border-slate-100 last:border-none">
                        <div>
                            <p class="text-xs font-bold text-slate-800">${c.name}</p>
                            <p class="text-[10px] text-ranah-gold font-medium">${c.nickname}</p>
                        </div>
                        <span class="text-[10px] text-slate-400">📍 Lihat Profil</span>
                    </div>
                `).join('');
            }
            resultsBox.classList.remove('hidden');
        }

        // Initialize on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            navigateTo('home');
        });
    </script>
</body>
</html>
