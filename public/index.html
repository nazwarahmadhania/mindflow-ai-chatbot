<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MindFlow AI - Digital Wellbeing & Productivity Assistant</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css"/>

  <!-- Markdown parser and sanitizer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="chat-app-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-left">
        <div class="bot-avatar header-avatar">
          <!-- Sprout Leaves SVG Icon -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 22V12" stroke="#2d6240" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M12 12C12 7.02944 16.0294 3 21 3C21 7.97056 16.9706 12 12 12Z" fill="#38714b" stroke="#2d6240" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M12 15C12 11.134 8.86599 8 5 8C5 11.866 8.13401 15 12 15Z" fill="#8bc19d" stroke="#2d6240" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="header-info">
          <h1 class="brand-title">MindFlow AI</h1>
          <p class="brand-subtitle">Your Digital Wellbeing & Productivity Assistant</p>
        </div>
      </div>

      <div class="header-right">
        <div class="settings-menu-wrapper">
          <button id="settings-btn" class="icon-btn" type="button" title="Pengaturan">
            <!-- Gear Icon -->
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#486853" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <div id="settings-dropdown" class="dropdown-menu hidden">
            <button id="clear-btn" type="button" class="dropdown-item danger">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              Hapus Riwayat Chat
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Chat Messages Scroll Area -->
    <main id="chat-box" class="chat-messages-area"></main>

    <!-- Quick Suggestion Action Pills -->
    <div class="suggestion-chips-container">
      <button type="button" class="chip-btn" data-prompt="Bantu aku membuat rencana kerja dan aktivitas hari ini dengan teratur dan realistis.">
        <span class="chip-icon">📅</span> Plan My Day
      </button>
      <button type="button" class="chip-btn" data-prompt="Bantu aku menyusun rencana pengerjaan tugas dengan Smart Planner. Tolong bagi tugas menjadi langkah-langkah kecil, tentukan prioritas, dan berikan estimasi waktu.">
        <span class="chip-icon">📋</span> Smart Planner
      </button>
      <button type="button" class="chip-btn" data-prompt="Bantu aku belajar materi baru dengan metode belajar efektif (Active Recall & Feynman).">
        <span class="chip-icon">📖</span> Study Coach
      </button>
      <button type="button" class="chip-btn" data-prompt="Aku merasa butuh jeda dan refleksi kesehatan mental. Bagaimana cara mengelola stres saat ini?">
        <span class="chip-icon">🌱</span> Wellbeing Check
      </button>
    </div>

    <!-- Chat Input Area -->
    <footer class="chat-footer">
      <!-- Attachment Preview Bar -->
      <div id="attachment-preview" class="attachment-preview-bar hidden">
        <div class="attachment-preview-content">
          <div id="preview-thumb-wrapper" class="preview-thumb-wrapper"></div>
          <div class="preview-file-info">
            <span id="preview-filename" class="preview-filename"></span>
            <span id="preview-filesize" class="preview-filesize"></span>
          </div>
        </div>
        <button type="button" id="remove-attach-btn" class="remove-attach-btn" title="Batalkan Lampiran">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form id="chat-form" class="chat-input-capsule">
        <input type="file" id="file-input" accept="image/*,.pdf,.txt,.md,.csv,.json" style="display: none;" />
        <button type="button" id="attach-btn" class="input-action-btn" title="Lampirkan Gambar atau Dokumen">
          <!-- Paperclip SVG Icon -->
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#7e9686" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
        </button>
        <input type="text" id="user-input" placeholder="Ketik pesan atau tanyakan isi dokumen..." autocomplete="off" />
        <button type="submit" id="send-btn" class="send-circle-btn" title="Kirim Pesan">
          <!-- Paper Airplane SVG Icon -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
